# SPDX-License-Identifier: MIT
# The library and the `2fa` command; the PAM module is the `pam/` member. The fuzz targets in
# `fuzz/` are a separate workspace, built with nightly Rust.
[workspace]
members = ["pam"]
default-members = [".", "pam"]
exclude = ["fuzz"]

[package]
name = "pam-totp"
version = "0.1.0"
edition = "2024"
# The Rust in Debian 13 (trixie).
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NyraOS/pam-totp"
description = "TOTP two-factor for SSH password logins on Nyra OS servers"

# Exact versions: the code that runs as root in the login path is only changed by a reviewed bump.
[dependencies]
getrandom = "=0.3.4"
hmac = "=0.12.1"
qrcode = { version = "=0.14.1", default-features = false }
rustix = { version = "=1.1.5", features = ["fs", "process", "system"] }
sha1 = "=0.11.0"
sha2 = "=0.10.9"
subtle = "=2.6.1"

# The PAM module catches every panic at its exported functions, which needs unwinding: never set
# `panic = "abort"` here.
[profile.release]
panic = "unwind"
