# SPDX-License-Identifier: MIT
[package]
name = "pam-totp"
version = "0.1.0"
edition = "2024"
# The Rust in Debian 13 (trixie).
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NyraOS/pam-totp"
description = "TOTP two-factor for SSH password logins on Nyra OS servers"

# Exact versions: the code that runs as root in the login path is only changed by a reviewed bump.
[dependencies]
getrandom = "=0.3.4"
hmac = "=0.12.1"
qrcode = { version = "=0.14.1", default-features = false }
rustix = { version = "=1.1.5", features = ["fs", "process", "system"] }
sha1 = "=0.10.6"
sha2 = "=0.10.9"
subtle = "=2.6.1"
